<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Casório</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="login.css">
</head>

<body class="login-body">
    <main class="login-card">
        <header class="login-logo">
            <span class="login-monogram"><svg class="brand-rings" viewBox="0 0 64 42" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="25" r="14"/><circle cx="40" cy="25" r="14"/><path d="M36 7.5 38 4.5h4l2 3-4 3.5z" stroke-width="1.6"/></svg></span>
            <h1>Nosso Casório</h1>
            <p id="login-subtitle">Entre para ver os valores e o planejamento</p>
        </header>

        <form id="auth-form" class="auth-form" novalidate>
            <div class="input-group">
                <label for="auth-email">E-mail</label>
                <input type="email" id="auth-email" class="input" placeholder="voce@email.com" required
                    autocomplete="email">
            </div>

            <div class="input-group">
                <label for="auth-password">Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="auth-password" class="input" placeholder="Mínimo 6 caracteres" required
                        minlength="6" autocomplete="current-password">
                    <button type="button" id="toggle-password" class="toggle-password-btn" tabindex="-1"
                        aria-label="Mostrar senha">Ver</button>
                </div>
            </div>

            <p id="auth-feedback" class="auth-feedback" role="status" aria-live="polite"></p>

            <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Entrar</button>
        </form>

        <div class="login-actions">
            <button type="button" id="btn-forgot" class="link-btn">Esqueci minha senha</button>
            <button type="button" id="toggle-auth-mode" class="link-btn">Criar uma conta</button>
        </div>
    </main>

    <script type="module" src="auth.js"></script>
</body>

</html>
